name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: 安装 Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --no-save
      - name: 准备网页资源
        run: |
          mkdir -p www
          rsync -a --exclude=.git --exclude=node_modules --exclude=tools \
            --exclude=.github --exclude=dist-app --exclude=screenshots \
            --exclude=package.json --exclude=package-lock.json ./ www/
      - name: 初始化 Capacitor
        run: npx cap init "拾遗潮" com.tolt.game --web-dir www
      - name: 添加安卓平台
        run: npx cap add android && npx cap sync android
      - name: 锁定横屏
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q sensorLandscape $M || sed -i 's|<activity|<activity\n            android:screenOrientation="sensorLandscape"|' $M
          grep -q screenOrientation $M && echo "横屏锁定 OK"
      - name: 对齐 Kotlin 版本
        run: |
          cat >> android/app/build.gradle <<'G'

          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib:1.8.22") { because("align kotlin-stdlib") }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") { because("align jdk7") }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") { because("align jdk8") }
              }
          }
          G
      - name: 沉浸式全屏
        run: |
          set +e
          python3 - <<'P'
          import json, re, glob
          try:
              p = "android/app/src/main/res/values/styles.xml"
              s = open(p).read()
              print("===styles.xml===")
              print(s)
              if "windowFullscreen" not in s:
                  s2 = re.sub(r'(<style name="AppTheme.NoActionBar"[^>]*>)',
                              r'\1\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>', s)
                  print("注入结果:", s2 != s)
                  if s2 != s:
                      open(p, "w").write(s2)
          except Exception as e:
              print("styles跳过:", e)
          try:
              cfgs = glob.glob("capacitor.config.*")
              print("配置文件:", cfgs)
              for cp in cfgs:
                  if cp.endswith(".json"):
                      c = json.load(open(cp))
                      c["backgroundColor"] = "#05070d"
                      json.dump(c, open(cp, "w"), ensure_ascii=False, indent=2)
          except Exception as e:
              print("config跳过:", e)
          print("沉浸式步骤完成")
          P
          exit 0
      - name: 打包 APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 拾遗潮-安卓安装包
          path: android/app/build/outputs/apk/debug/app-debug.apk
