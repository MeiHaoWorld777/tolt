name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: 安装 Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --no-save
      - name: 准备网页资源
        run: |
          mkdir -p www
          rsync -a --exclude=.git --exclude=node_modules --exclude=tools \
            --exclude=.github --exclude=dist-app --exclude=screenshots \
            --exclude=package.json --exclude=package-lock.json ./ www/
      - name: 初始化 Capacitor
        run: npx cap init "拾遗潮" com.tolt.game --web-dir www
      - name: 添加安卓平台
        run: npx cap add android && npx cap sync android
      - name: 锁定横屏
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q sensorLandscape $M || sed -i 's|<activity|<activity\n            android:screenOrientation="sensorLandscape"|' $M
          grep -q screenOrientation $M && echo "横屏锁定 OK"
      - name: 对齐 Kotlin 版本
        run: |
          cat >> android/app/build.gradle <<'G'

          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib:1.8.22") { because("align kotlin-stdlib") }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") { because("align jdk7") }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") { because("align jdk8") }
              }
          }
          G
      - name: 沉浸式全屏
        run: |
          python3 - <<'P'
          import json
          # 主题加全屏+挖孔延伸
          s = open("android/app/src/main/res/values/styles.xml").read()
          if "windowFullscreen" not in s:
              s = s.replace('<item name="windowNoTitle">true</item>',
                  '<item name="windowNoTitle">true</item>\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>')
              open("android/app/src/main/res/values/styles.xml", "w").write(s)
          # WebView 底色设为夜空深色
          c = json.load(open("capacitor.config.json"))
          c["backgroundColor"] = "#05070d"
          json.dump(c, open("capacitor.config.json", "w"), ensure_ascii=False, indent=2)
          P
          grep -c windowFullscreen android/app/src/main/res/values/styles.xml
      - name: 打包 APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 拾遗潮-安卓安装包
          path: android/app/build/outputs/apk/debug/app-debug.apk
