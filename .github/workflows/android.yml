name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: 安装 Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --no-save
      - name: 准备网页资源
        run: |
          mkdir -p www
          rsync -a --exclude=.git --exclude=node_modules --exclude=tools \
            --exclude=.github --exclude=dist-app --exclude=screenshots \
            --exclude=package.json --exclude=package-lock.json ./ www/
      - name: 初始化 Capacitor
        run: npx cap init "拾遗潮" com.tolt.game --web-dir www
      - name: 添加安卓平台
        run: npx cap add android && npx cap sync android
      - name: 锁定横屏
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q sensorLandscape $M || sed -i 's|<activity|<activity\n            android:screenOrientation="sensorLandscape"|' $M
          grep -q screenOrientation $M && echo "横屏锁定 OK"
      - name: 打包 APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 拾遗潮-安卓安装包
          path: android/app/build/outputs/apk/debug/app-debug.apk
